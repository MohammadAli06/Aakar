name: craft_connect
description: CraftConnect — AI-Driven Market Linkage for Marginalized Artisans (SIH 2026)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_storage: ^12.1.3
  cloud_firestore: ^5.2.1

  # HTTP & API
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  photo_view: ^0.15.0

  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  record: ^5.1.2

  # UI & Animations
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  pinput: ^5.0.0

  # Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.1

  # Permissions & Device
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2

  # Utilities
  intl: ^0.20.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
